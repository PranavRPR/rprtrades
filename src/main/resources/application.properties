spring.application.name=rprtrades

# =====================================
# Thymeleaf
# =====================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =====================================
# PostgreSQL
# =====================================
spring.datasource.url=jdbc:postgresql://localhost:5432/rprtrades
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================
# JPA / Hibernate
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =====================================
# JWT
# =====================================
app.jwt.secret=rprtrades_secret_key_2026_rprtrades_secret_key_2026
app.jwt.expiration=86400000

# =====================================
# Disable default Spring Security user
# =====================================
spring.security.user.name=disabled
spring.security.user.password=disabled

# =====================================
# Logging
# =====================================
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
