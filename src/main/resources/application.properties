spring.application.name=rprtrades

server.port=${PORT:8080}

# =====================================
# Thymeleaf
# =====================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =====================================
# PostgreSQL - Render
# =====================================
spring.datasource.url=jdbc:${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================
# JPA / Hibernate
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =====================================
# JWT
# =====================================
app.jwt.secret=${APP_JWT_SECRET:rprtrades_secret_key_2026_rprtrades_secret_key_2026}
app.jwt.expiration=86400000

# =====================================
# Disable default Spring Security user
# =====================================
spring.security.user.name=disabled
spring.security.user.password=disabled

# =====================================
# Logging
# =====================================
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN