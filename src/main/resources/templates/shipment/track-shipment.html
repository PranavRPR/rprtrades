<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Shipment | RPR Trades</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- CSS -->

    <link rel="stylesheet" th:href="@{/css/shipment.css}">
    <link rel="stylesheet" th:href="@{/css/table.css}">


</head>


<body>


<div class="container py-5">


    <div class="d-flex justify-content-between align-items-center mb-4">


        <div>

            <h2>

                <i class="bi bi-geo-alt-fill text-primary"></i>

                Track Shipment

            </h2>


            <p class="text-muted">

                Check your shipment status and current location.

            </p>


        </div>



        <a th:href="@{/dashboard/importer}"
           class="btn btn-secondary">

            Dashboard

        </a>


    </div>





    <div class="card shadow border-0">


        <div class="card-body">


            <div class="table-responsive">


                <table class="table table-hover align-middle">


                    <thead class="table-dark">


                    <tr>


                        <th>
                            Tracking Number
                        </th>


                        <th>
                            Order ID
                        </th>


                        <th>
                            Current Location
                        </th>


                        <th>
                            Status
                        </th>


                        <th class="text-center">
                            Action
                        </th>


                    </tr>


                    </thead>



                    <tbody id="shipmentTrackTable">


                    </tbody>



                </table>


            </div>


        </div>


    </div>


</div>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toast.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/auth-guard.js}"></script>
<script th:src="@{/js/shipment.js}"></script>


</body>


</html>
