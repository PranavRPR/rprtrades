<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Management | RPR Trades</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/dashboard.css}">

<style>

body{
    background:#f5f7fb;
}

.page-header{
    background:linear-gradient(135deg,#0d6efd,#4f8dff);
    color:#fff;
    padding:30px;
    border-radius:15px;
    margin-bottom:25px;
}

.payment-card{
    border:none;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.summary-card{
    border:none;
    border-radius:15px;
    color:#fff;
    padding:25px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.summary-card h3{
    font-weight:700;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<div class="page-header d-flex justify-content-between align-items-center">

<div>

<h2>
<i class="bi bi-credit-card-fill"></i>
Payment Management
</h2>

<p class="mb-0">
Manage all payment transactions.
</p>

</div>

<a th:href="@{/dashboard}" class="btn btn-light">
<i class="bi bi-arrow-left"></i>
Dashboard
</a>

</div>

<div class="row mb-4">

<div class="col-lg-4 mb-3">

<div class="summary-card bg-primary">

<h6>Total Payments</h6>

<h3 id="totalPayments">0</h3>

</div>

</div>

<div class="col-lg-4 mb-3">

<div class="summary-card bg-success">

<h6>Paid</h6>

<h3 id="paidPayments">0</h3>

</div>

</div>

<div class="col-lg-4 mb-3">

<div class="summary-card bg-danger">

<h6>Pending</h6>

<h3 id="pendingPayments">0</h3>

</div>

</div>

</div>

<div class="card payment-card">

<div class="card-body">

<div class="row mb-4">

<div class="col-md-4">

<input
id="searchPayment"
type="text"
class="form-control"
placeholder="Search Payment">

</div>

<div class="col-md-3">

<select
id="statusFilter"
class="form-select">

<option value="">All Status</option>
<option>PAID</option>
<option>PENDING</option>
<option>FAILED</option>

</select>

</div>

<div class="col-md-2 d-grid">

<button
class="btn btn-primary"
onclick="loadPayments()">

<i class="bi bi-search"></i>

Search

</button>

</div>

<div class="col-md-2 d-grid">

<button
class="btn btn-secondary"
onclick="resetFilter()">

Reset

</button>

</div>

</div>

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead class="table-light">

<tr>

<th>ID</th>
<th>Order</th>
<th>Amount</th>
<th>Method</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="paymentTable">

<tr>

<td colspan="6" class="text-center">

Loading Payments...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<!-- Payment Details -->

<div class="modal fade" id="paymentModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Payment Details</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<p><strong>Payment ID :</strong> <span id="mPaymentId"></span></p>

<p><strong>Order :</strong> <span id="mOrder"></span></p>

<p><strong>Amount :</strong> ₹ <span id="mAmount"></span></p>

<p><strong>Method :</strong> <span id="mMethod"></span></p>

<p><strong>Status :</strong> <span id="mStatus"></span></p>

</div>

<div class="modal-footer">

<button class="btn btn-secondary" data-bs-dismiss="modal">

Close

</button>

<button class="btn btn-success" id="paidBtn">

Mark Paid

</button>

<button class="btn btn-danger" id="failedBtn">

Mark Failed

</button>

</div>

</div>

</div>

</div>

<!-- Continue Part 2 -->
 <div id="loading" class="text-center mt-4" style="display:none;">
    <div class="spinner-border text-primary"></div>
    <p class="mt-2">Loading Payments...</p>
</div>

<nav class="mt-4">
    <ul class="pagination justify-content-center" id="pagination"></ul>
</nav>

<footer class="text-center mt-5">
    <hr>
    <p class="text-muted">© 2026 RPR Trades | Payment Management</p>
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toast.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/auth-guard.js}"></script>

<script>

const API="/api";
const token=sessionStorage.getItem("token");
const role=sessionStorage.getItem("role");

const headers={
    "Authorization":"Bearer "+token,
    "Content-Type":"application/json"
};

let payments=[];
let selectedPayment=null;

async function loadPayments(){

    document.getElementById("loading").style.display="block";

    try{

        const response=await fetch(API+"/payments",{
            headers
        });

        payments=await response.json();

        renderPayments(payments);

        updateSummary(payments);

    }catch(e){

        Toast.show("Unable to load payments.", "danger");

    }

    document.getElementById("loading").style.display="none";

}

function renderPayments(data){

    const tbody=document.getElementById("paymentTable");

    tbody.innerHTML="";

    if(data.length===0){

        tbody.innerHTML=`
        <tr>
            <td colspan="6" class="text-center">
                No Payments Found
            </td>
        </tr>`;
        return;

    }

    data.forEach(payment=>{

        let badge="secondary";

        if(payment.status==="PAID") badge="success";
        if(payment.status==="PENDING") badge="warning";
        if(payment.status==="FAILED") badge="danger";

        tbody.innerHTML+=`

        <tr>

            <td>${payment.paymentId}</td>

            <td>${payment.order?.orderId??"-"}</td>

            <td>₹ ${payment.amount}</td>

            <td>${payment.paymentMethod}</td>

            <td>
                <span class="badge bg-${badge}">
                    ${payment.status}
                </span>
            </td>

            <td>

                <button
                    class="btn btn-primary btn-sm"
                    onclick="viewPayment(${payment.paymentId})">

                    <i class="bi bi-eye"></i>

                </button>

            </td>

        </tr>

        `;

    });

}

function updateSummary(data){

    document.getElementById("totalPayments").innerHTML=data.length;

    document.getElementById("paidPayments").innerHTML=
        data.filter(p=>p.status==="PAID").length;

    document.getElementById("pendingPayments").innerHTML=
        data.filter(p=>p.status==="PENDING").length;

}

function viewPayment(id){

    selectedPayment=payments.find(p=>p.paymentId===id);

    document.getElementById("mPaymentId").innerHTML=selectedPayment.paymentId;
    document.getElementById("mOrder").innerHTML=selectedPayment.order?.orderId??"-";
    document.getElementById("mAmount").innerHTML=selectedPayment.amount;
    document.getElementById("mMethod").innerHTML=selectedPayment.paymentMethod;
    document.getElementById("mStatus").innerHTML=selectedPayment.status;

    new bootstrap.Modal(
        document.getElementById("paymentModal")
    ).show();

}

document.getElementById("searchPayment")
.addEventListener("keyup",function(){

    const value=this.value.toLowerCase();

    renderPayments(

        payments.filter(payment=>

            String(payment.paymentId).includes(value) ||

            String(payment.order?.orderId??"").includes(value)

        )

    );

});

document.getElementById("statusFilter")
.addEventListener("change",function(){

    if(this.value===""){

        renderPayments(payments);

        return;

    }

    renderPayments(

        payments.filter(

            payment=>payment.status===this.value

        )

    );

});

function resetFilter(){

    document.getElementById("searchPayment").value="";
    document.getElementById("statusFilter").value="";

    renderPayments(payments);

}

if(role!=="ADMIN"){

    document.getElementById("paidBtn").style.display="none";
    document.getElementById("failedBtn").style.display="none";

}

</script>

<!-- Continue Part 3 -->
 <script>

async function updatePaymentStatus(status){

    if(!selectedPayment) return;

    const label = status === "PAID" ? "Mark as PAID" : "Mark as FAILED";
    Toast.confirm(`${label} payment #${selectedPayment.paymentId}?`, async () => {
        try{
            const response=await fetch(API+"/payments/status/"+selectedPayment.paymentId+"?status="+status,{
                method:"PUT", headers
            });
            if(response.ok){
                bootstrap.Modal.getInstance(document.getElementById("paymentModal")).hide();
                Toast.show("Payment status updated to " + status + ".", status === "PAID" ? "success" : "warning");
                loadPayments();
            }else{
                const error=await response.text();
                Toast.show(error || "Unable to update status.", "danger");
            }
        }catch(e){ Toast.show("Server error.", "danger"); }
    }, null, { confirmText: label, title: "Update Payment Status" });
}

document.getElementById("paidBtn")
.addEventListener("click",()=>{

    updatePaymentStatus("PAID");

});

document.getElementById("failedBtn")
.addEventListener("click",()=>{

    updatePaymentStatus("FAILED");

});

function buildPagination(){

    const pagination=document.getElementById("pagination");

    pagination.innerHTML=`
    <li class="page-item active">
        <a class="page-link" href="#">1</a>
    </li>
    `;

}

loadPayments();

buildPagination();

</script>

</body>
</html>
