<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Documents | RPR Trades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: #f5f7fb; }
        .page-header {
            background: linear-gradient(135deg, #fd7e14, #ffc107);
            color: #fff; padding: 28px 32px; border-radius: 18px; margin-bottom: 24px;
        }
        .table-card { border: none; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
        .table td, .table th { vertical-align: middle; padding: 13px 16px; }
        .table thead { background: #fff8f0; }
        .upload-box {
            border: 2px dashed #fd7e14; border-radius: 15px; padding: 30px;
            text-align: center; background: #fff; cursor: pointer; transition: .3s;
        }
        .upload-box:hover { background: #fff8f0; }
        .upload-box i { font-size: 40px; color: #fd7e14; }
    </style>
</head>
<body>
<div class="container-fluid py-4 px-4">

    <!-- Header -->
    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h3 class="mb-1"><i class="bi bi-file-earmark-arrow-up-fill me-2"></i>Export Documents</h3>
            <p class="mb-0 opacity-75">Upload shipping, customs and compliance documents.</p>
        </div>
        <a th:href="@{/dashboard/exporter}" class="btn btn-dark fw-semibold">
            <i class="bi bi-arrow-left me-1"></i>Dashboard
        </a>
    </div>

    <div class="row">
        <!-- Upload Section -->
        <div class="col-lg-4 mb-4">
            <div class="card border-0 shadow-sm" style="border-radius:14px;">
                <div class="card-body">
                    <h5 class="mb-4"><i class="bi bi-cloud-arrow-up-fill text-warning me-2"></i>Upload Document</h5>
                    <form id="uploadForm">
                        <div class="upload-box mb-3">
                            <i class="bi bi-cloud-arrow-up-fill"></i>
                            <h6 class="mt-2">Choose Document</h6>
                            <input type="file" id="documentFile" class="form-control mt-3" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Related Order (optional)</label>
                            <select id="orderSelect" class="form-select">
                                <option value="">-- No Order --</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-semibold">
                            <i class="bi bi-upload me-1"></i>Upload
                        </button>
                    </form>
                    <div id="message" class="mt-3"></div>
                </div>
            </div>
        </div>

        <!-- Document List -->
        <div class="col-lg-8">
            <div class="card table-card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th><th>File Name</th><th>Type</th>
                                    <th>Order</th><th class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="documentTable">
                                <tr><td colspan="5" class="text-center py-5">
                                    <div class="spinner-border text-warning"></div>
                                </td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div id="emptyState" class="text-center py-5" style="display:none;">
                <i class="bi bi-folder-x display-1 text-secondary"></i>
                <h4 class="mt-3">No Documents Yet</h4>
                <p class="text-muted">Upload export documents like invoices, packing lists, and customs forms.</p>
            </div>
        </div>
    </div>

    <footer class="text-center mt-5 pt-3 border-top">
        <small class="text-muted">© 2026 RPR Trades | Exporter Module</small>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toast.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/auth-guard.js}"></script>
<script>
const API       = "/api";
const token     = sessionStorage.getItem("token");
const userId    = sessionStorage.getItem("userId");
const headers   = { "Authorization": "Bearer " + token };
const jsonHeaders = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };

async function loadDocuments() {
    try {
        const r = await fetch(`${API}/documents/my/${userId}`, { headers });
        if (!r.ok) throw new Error(await r.text());
        const docs = await r.json();
        renderTable(docs);
    } catch(e) {
        document.getElementById("documentTable").innerHTML =
            `<tr><td colspan="5" class="text-center text-danger py-4">${e.message}</td></tr>`;
    }
}

function renderTable(docs) {
    const tb = document.getElementById("documentTable");
    const es = document.getElementById("emptyState");
    tb.innerHTML = "";
    if (!docs.length) { es.style.display="block"; return; }
    es.style.display = "none";
    docs.forEach(d => {
        tb.innerHTML += `
        <tr>
            <td>${d.id}</td>
            <td><i class="bi bi-file-earmark-text text-warning me-1"></i>${d.fileName}</td>
            <td><span class="badge bg-info">${d.fileType||"-"}</span></td>
            <td>${d.order ? "#"+d.order.orderId : "-"}</td>
            <td class="text-center">
                <a href="${API}/documents/download/${d.id}" class="btn btn-sm btn-outline-primary" title="Download">
                    <i class="bi bi-download"></i>
                </a>
            </td>
        </tr>`;
    });
}

async function loadOrders() {
    try {
        const r = await fetch(`${API}/orders/exporter/${userId}`, { headers: jsonHeaders });
        const orders = await r.json();
        const select = document.getElementById("orderSelect");
        orders.forEach(o => {
            select.innerHTML += `<option value="${o.orderId}">Order #${o.orderId} - ${o.product?.productName||""}</option>`;
        });
    } catch(e) { /* ignore */ }
}

document.getElementById("uploadForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const file = document.getElementById("documentFile").files[0];
    if (!file) { showMessage("Please select a file.", "danger"); return; }

    const formData = new FormData();
    formData.append("file", file);
    formData.append("uploadedById", userId);
    const orderId = document.getElementById("orderSelect").value;
    if (orderId) formData.append("orderId", orderId);

    try {
        const r = await fetch(`${API}/documents/upload`, { method:"POST", headers, body: formData });
        if (r.ok) {
            showMessage("Document uploaded successfully!", "success");
            document.getElementById("uploadForm").reset();
            loadDocuments();
        } else {
            showMessage(await r.text(), "danger");
        }
    } catch(e) {
        showMessage("Server error.", "danger");
    }
});

function showMessage(msg, type) {
    document.getElementById("message").innerHTML =
        `<div class="alert alert-${type} alert-dismissible fade show">${msg}
         <button class="btn-close" data-bs-dismiss="alert"></button></div>`;
}

loadDocuments();
loadOrders();
</script>
</body>
</html>
