<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | RPR Trades</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/dashboard.css}">

<style>
body{
    background:#f4f7fc;
}
.page-header{
    background:linear-gradient(135deg,#0d6efd,#5b9dff);
    color:#fff;
    padding:30px;
    border-radius:15px;
    margin-bottom:25px;
}
.table-card{
    border:none;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}
.status-badge{
    font-size:13px;
}
</style>

</head>

<body>

<div class="container-fluid p-4">

<div class="page-header d-flex justify-content-between align-items-center">

<div>
<h2><i class="bi bi-cart-check-fill"></i> Order Management</h2>
<p class="mb-0">Manage import & export orders.</p>
</div>

<a th:href="@{/dashboard}" class="btn btn-light">
<i class="bi bi-arrow-left"></i>
Dashboard
</a>

</div>

<div class="card table-card">

<div class="card-body">

<div class="row mb-4">

<div class="col-md-4">
<input type="text" id="searchOrder" class="form-control" placeholder="Search Order">
</div>

<div class="col-md-3">
<select id="statusFilter" class="form-select">
<option value="">All Status</option>
<option>PENDING</option>
<option>APPROVED</option>
<option>REJECTED</option>
<option>SHIPPED</option>
</select>
</div>

<div class="col-md-2 d-grid">
<button class="btn btn-primary" onclick="loadOrders()">
<i class="bi bi-search"></i>
Search
</button>
</div>

<div class="col-md-2 d-grid">
<button class="btn btn-secondary" onclick="resetFilter()">
Reset
</button>
</div>

</div>

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead class="table-light">

<tr>
<th>ID</th>
<th>Importer</th>
<th>Product</th>
<th>Quantity</th>
<th>Total</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="orderTable">

<tr>
<td colspan="7" class="text-center">
Loading Orders...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

<!-- Order Details -->

<div class="modal fade" id="orderModal">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5>Order Details</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<div class="row">

<div class="col-md-6">

<p><strong>Order ID :</strong> <span id="mOrderId"></span></p>

<p><strong>Importer :</strong> <span id="mImporter"></span></p>

<p><strong>Product :</strong> <span id="mProduct"></span></p>

<p><strong>Quantity :</strong> <span id="mQuantity"></span></p>

</div>

<div class="col-md-6">

<p><strong>Total Amount :</strong> ₹ <span id="mAmount"></span></p>

<p><strong>Status :</strong> <span id="mStatus"></span></p>

</div>

</div>

</div>

<div class="modal-footer">

<button class="btn btn-secondary" data-bs-dismiss="modal">
Close
</button>

<button class="btn btn-success" id="approveBtn">
Approve
</button>

<button class="btn btn-danger" id="rejectBtn">
Reject
</button>

</div>

</div>

</div>

</div>

<!-- Continue Part 2 -->
 <div id="loading" class="text-center mt-4" style="display:none;">
    <div class="spinner-border text-primary"></div>
    <p class="mt-2">Loading Orders...</p>
</div>

<nav class="mt-4">
    <ul class="pagination justify-content-center" id="pagination"></ul>
</nav>

<footer class="text-center mt-5">
    <hr>
    <p class="text-muted">© 2026 RPR Trades | Order Management</p>
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toast.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/auth-guard.js}"></script>

<script>

const API="/api";
const token=sessionStorage.getItem("token");
const role=sessionStorage.getItem("role");

const headers={
    "Authorization":"Bearer "+token,
    "Content-Type":"application/json"
};

let orders=[];
let selectedOrder=null;

async function loadOrders(){

    document.getElementById("loading").style.display="block";

    try{

        const response=await fetch(API+"/orders",{
            headers
        });

        orders=await response.json();

        renderOrders(orders);

    }catch(e){

        Toast.show("Unable to load orders.", "danger");

    }

    document.getElementById("loading").style.display="none";

}

function renderOrders(data){

    const tbody=document.getElementById("orderTable");

    tbody.innerHTML="";

    if(data.length===0){

        tbody.innerHTML=`
        <tr>
            <td colspan="7" class="text-center">
                No Orders Found
            </td>
        </tr>
        `;

        return;

    }

    data.forEach(order=>{

        tbody.innerHTML+=`

        <tr>

            <td>${order.orderId}</td>

            <td>${order.importer?.name??"-"}</td>

            <td>${order.product?.productName??"-"}</td>

            <td>${order.quantity}</td>

            <td>₹ ${order.totalAmount}</td>

            <td>
                <span class="badge bg-primary">
                    ${order.status}
                </span>
            </td>

            <td>

                <button
                    class="btn btn-info btn-sm"
                    onclick="viewOrder(${order.orderId})">

                    <i class="bi bi-eye"></i>

                </button>

            </td>

        </tr>

        `;

    });

}

document.getElementById("searchOrder")
.addEventListener("keyup",function(){

    const value=this.value.toLowerCase();

    renderOrders(

        orders.filter(order=>

            String(order.orderId).includes(value) ||

            order.product.productName
            .toLowerCase()
            .includes(value)

        )

    );

});

document.getElementById("statusFilter")
.addEventListener("change",function(){

    if(this.value===""){

        renderOrders(orders);

        return;

    }

    renderOrders(

        orders.filter(

            order=>order.status===this.value

        )

    );

});

function resetFilter(){

    document.getElementById("searchOrder").value="";

    document.getElementById("statusFilter").value="";

    renderOrders(orders);

}

function viewOrder(id){

    selectedOrder=

        orders.find(

            order=>order.orderId===id

        );

    document.getElementById("mOrderId").innerHTML=
        selectedOrder.orderId;

    document.getElementById("mImporter").innerHTML=
        selectedOrder.importer.name;

    document.getElementById("mProduct").innerHTML=
        selectedOrder.product.productName;

    document.getElementById("mQuantity").innerHTML=
        selectedOrder.quantity;

    document.getElementById("mAmount").innerHTML=
        selectedOrder.totalAmount;

    document.getElementById("mStatus").innerHTML=
        selectedOrder.status;

    new bootstrap.Modal(
        document.getElementById("orderModal")
    ).show();

}

if(role!=="ADMIN"){

    document.getElementById("approveBtn").style.display="none";

    document.getElementById("rejectBtn").style.display="none";

}

</script>

<!-- Continue Part 3 -->
 <script>

async function approveOrder(){

    if(selectedOrder==null) return;

    Toast.confirm(`Approve order #${selectedOrder.orderId}?`, async () => {
        try{
            const response=await fetch(API+"/orders/approve/"+selectedOrder.orderId,{
                method:"PUT", headers
            });
            if(response.ok){
                bootstrap.Modal.getInstance(document.getElementById("orderModal")).hide();
                Toast.show("Order #"+selectedOrder.orderId+" approved!", "success");
                loadOrders();
            }else{
                Toast.show(await response.text() || "Unable to approve order.", "danger");
            }
        }catch(e){ Toast.show("Server error.", "danger"); }
    }, null, { confirmText: "Approve", title: "Approve Order" });
}

async function rejectOrder(){

    if(selectedOrder==null) return;

    Toast.confirm(`Reject order #${selectedOrder.orderId}?`, async () => {
        try{
            const response=await fetch(API+"/orders/reject/"+selectedOrder.orderId,{
                method:"PUT", headers
            });
            if(response.ok){
                bootstrap.Modal.getInstance(document.getElementById("orderModal")).hide();
                Toast.show("Order #"+selectedOrder.orderId+" rejected.", "warning");
                loadOrders();
            }else{
                Toast.show(await response.text() || "Unable to reject order.", "danger");
            }
        }catch(e){ Toast.show("Server error.", "danger"); }
    }, null, { confirmText: "Reject", title: "Reject Order" });
}

document.getElementById("approveBtn")
.addEventListener("click",approveOrder);

document.getElementById("rejectBtn")
.addEventListener("click",rejectOrder);

// --------------------
// Simple Pagination
// --------------------

function buildPagination(){

    const pagination=document.getElementById("pagination");

    pagination.innerHTML="";

    pagination.innerHTML=`
    <li class="page-item active">
        <a class="page-link" href="#">1</a>
    </li>
    `;

}

// --------------------
// Initial Load
// --------------------

loadOrders();

buildPagination();

</script>

</body>

</html>
